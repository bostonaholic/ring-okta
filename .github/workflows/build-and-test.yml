name: Build and Test

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Leiningen
      uses: DeLaGuardo/setup-clojure@12.1
      with:
        lein: latest

    - name: Use cache for maven dependencies
      uses: actions/cache@v4
      env:
        cache-name: cache-maven-deps
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Install dependencies
      run: script/bootstrap

  test:
    needs: build

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21, 25]

    steps:
    - uses: actions/checkout@v4

    - name: Install Java ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}

    - name: Install Leiningen
      uses: DeLaGuardo/setup-clojure@12.1
      with:
        lein: latest

    - name: Use cache for maven dependencies
      uses: actions/cache@v4
      env:
        cache-name: cache-maven-deps
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/project.clj') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Run tests
      run: script/cibuild

    - name: Run code coverage
      if: matrix.java == 21
      run: lein cloverage

    - name: Upload coverage reports
      if: matrix.java == 21
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: docs/coverage

    - name: Build the example app against this version
      if: matrix.java == 21
      run: |
        lein install
        version=$(sed -n '1s/^(defproject [^ ]* "\([^"]*\)".*/\1/p' project.clj)
        test -n "$version"
        cd examples/example-app
        # The example depends on the latest release; build it against this
        # commit's version, which lein install just put in the local repo.
        sed -i.bak "s|\[dev.bostonaholic/ring-okta \"[^\"]*\"\]|[dev.bostonaholic/ring-okta \"$version\"]|" project.clj
        grep -qF "[dev.bostonaholic/ring-okta \"$version\"]" project.clj
        lein check
